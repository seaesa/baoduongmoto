  <link rel="stylesheet" href="{{P}}assets/css/widgets.css">
  <script>
    // Clean URL: /index.html -> /, /page.html -> /page (keeps ?query and #hash, no reload)
    (function () {
      var p = location.pathname, clean = p.replace(/\/index\.html$/i, '/').replace(/\.html$/i, '');
      if (clean !== p && window.history && history.replaceState) {
        history.replaceState(history.state, '', clean + location.search + location.hash);
      }
    })();
  </script>
